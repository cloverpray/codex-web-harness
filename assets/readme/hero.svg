<g font-family="Arial,Helvetica,sans-serif"><text x="64" y="75" fill="#89eed5" font-size="18" font-weight="700" letter-spacing="3">CODEX WEB HARNESS</text>
<text x="64" y="158" fill="#f4f8fd" font-size="56" font-weight="700">Your Codex tools.</text><text x="64" y="226" fill="#f4f8fd" font-size="56" font-weight="700">Your ChatGPT session.</text><text x="64" y="294" fill="url(#accent)" font-size="56" font-weight="700">One workflow.</text>
<text x="64" y="345" fill="#b4c8d7" font-size="22">Opt into Web High / Pro. Keep native Codex available.</text>
<rect x="64" y="384" width="662" height="112" rx="14" fill="#06111d" stroke="#325766"/><circle cx="87" cy="408" r="4" fill="#78efd0"/><text x="106" y="415" fill="#94aebb" font-size="14">AFTER WEB PROFILE SETUP</text><text x="87" y="456" fill="#e3f6ed" font-family="monospace" font-size="22">codex -p web -m chatgpt-web/high</text>
