<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Two explicit routes, one Codex workflow</title><desc id="desc">Native Codex uses the existing configuration. A Web profile connects Codex through a local bridge to the launcher and ChatGPT. Full mode routes tools to the current task.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#519b9a"/></marker></defs><rect width="1200" height="390" rx="18" fill="#f5f8fc"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="51" font-size="26" font-weight="700" fill="#142d45">Choose the route. Keep the workflow.</text><g fill="#fff" stroke="#c4d4df"><rect x="40" y="112" width="215" height="140" rx="14"/><rect x="355" y="86" width="260" height="78" rx="14"/><rect x="355" y="204" width="260" height="92" rx="14"/><rect x="714" y="204" width="430" height="92" rx="14"/></g><g font-size="20" fill="#153349" font-weight="700"><text x="69" y="155">Your Codex task</text><text x="380" y="121">Native Codex</text><text x="380" y="239">Local Web bridge</text><text x="740" y="239">Launcher → ChatGPT Web</text></g><g font-size="16" fill="#496579"><text x="69" y="190">Repo · Tools · State</text><text x="69" y="218">Your task permissions</text><text x="380" y="145">codex</text><text x="380" y="268">codex -p web</text><text x="740" y="268">A task-bound browser conversation</text></g><g fill="none" stroke="#519b9a" stroke-width="2" marker-end="url(#arrow)"><path d="M255 145H306V125H352"/><path d="M255 218H306V250H352"/><path d="M615 250H710"/><path d="M925 297V342H150V255"/></g><rect x="396" y="321" width="438" height="41" rx="10" fill="#e5f2ee"/><text x="420" y="347" font-size="16" fill="#20564e">Full mode: MCP → current Codex task tools</text></g></svg>
